name: Call batch attestation

on:
  push:
    branches:
      - feature/call-batch-attestation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile changed runtime
        run: |
          python -m py_compile academy/call_attestation.py academy/call_attestation_runtime.py academy_v2_launcher.py
      - name: Run full test suite
        run: python -W ignore::ResourceWarning -m unittest discover -s tests -v
