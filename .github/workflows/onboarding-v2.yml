name: Academy onboarding v2

on:
  push:
    branches:
      - academy/onboarding-v2
  workflow_dispatch:

jobs:
  test-onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Compile Academy v2 files
        run: |
          python -m py_compile academy/onboarding.py academy/onboarding_progress.py academy/mobile_learning_runtime.py academy/ui_policy.py academy/ui_state.py academy_v2_launcher.py bot.py
      - name: Run Academy v2 tests
        run: |
          pytest -q \
            tests/test_onboarding_route.py \
            tests/test_onboarding_progress.py \
            tests/test_ui_policy.py \
            tests/test_ui_state.py \
            tests/test_academy_context_navigation.py
